services:
  web:
    image: ghcr.io/chenjiangbo/xipilabs-web:latest
    pull_policy: always
    container_name: xipilabs-web
    restart: unless-stopped
    command: ["node_modules/.bin/next", "start", "-p", "3210"]
    expose:
      - "3210"
    environment:
      NODE_ENV: production
      PORT: 3210
      NODE_OPTIONS: --conditions=react-server
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    pids_limit: 256
    mem_limit: 1500m
    cpus: "1.0"
    networks:
      - xipi-network

networks:
  xipi-network:
    external: true
