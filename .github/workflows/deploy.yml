name: Build and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/chenjiangbo/xipilabs-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL="postgresql://dummy:dummy@dummy:5432/dummy"

      - name: Upload deployment compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/docker-compose.yml"
          strip_components: 1
          target: ${{ secrets.PROJECT_PATH }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            export DOCKER_COMPOSE_DISABLE_TUI=1
            cd ${{ secrets.PROJECT_PATH }}
            
            # Escape multiline Apple private key into single-line with \n to fit .env format
            APPLE_PRIVATE_KEY_ESCAPED=$(printf '%s' "${{ secrets.APPLE_PRIVATE_KEY }}" | awk '{printf "%s\\n",$0}' | sed 's/\\n$//')

            # Recreate the .env file from individual secrets
            rm -f .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
            echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "ALIYUN_ACCESS_KEY_ID=${{ secrets.ALIYUN_ACCESS_KEY_ID }}" >> .env
            echo "ALIYUN_ACCESS_KEY_SECRET=${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" >> .env
            echo "ALIYUN_SMS_SIGN_NAME=${{ secrets.ALIYUN_SMS_SIGN_NAME }}" >> .env
            echo "ALIYUN_SMS_TEMPLATE_CODE=${{ secrets.ALIYUN_SMS_TEMPLATE_CODE }}" >> .env
            echo "ALIYUN_SMS_REGION=${{ secrets.ALIYUN_SMS_REGION }}" >> .env
            echo "OTP_DEV_MODE=${{ secrets.OTP_DEV_MODE }}" >> .env
            echo "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" >> .env
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> .env
            echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> .env
            echo "APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY_ESCAPED}" >> .env
            echo "APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}" >> .env
            echo "EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}" >> .env
            echo "EMAIL_SMTP_PORT=${{ secrets.EMAIL_SMTP_PORT }}" >> .env
            echo "EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}" >> .env
            echo "EMAIL_SMTP_PASS=${{ secrets.EMAIL_SMTP_PASS }}" >> .env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
            echo "EMAIL_CODE_TTL_SECONDS=${{ secrets.EMAIL_CODE_TTL_SECONDS }}" >> .env
            echo "EMAIL_CODE_COOLDOWN_SECONDS=${{ secrets.EMAIL_CODE_COOLDOWN_SECONDS }}" >> .env
            echo "EMAIL_CODE_MAX_ATTEMPTS=${{ secrets.EMAIL_CODE_MAX_ATTEMPTS }}" >> .env
            
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker image prune -f
